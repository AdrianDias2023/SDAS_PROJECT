services:
  - type: web
    name: sdas-ai-inference-server
    runtime: python
    rootDir: SDAS_Full_Project/03_Machine_Learning
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn inference_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
    plan: free
